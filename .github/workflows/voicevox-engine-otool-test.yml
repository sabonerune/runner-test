name: Test voicevox-engine otool

on:
  workflow_dispatch:
    inputs:
      repo:
        default: sabonerune/voicevox_engine
      tag:
        default: 0.26.0-preview.2


jobs:
  test-onnxruntime:
    strategy:
      matrix:
        include:
          - os: macos-26-intel
            architecture: x64
          - os: macos-latest
            architecture: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Download engine
        run: |
          repo=${{ inputs.repo || 'sabonerune/voicevox_engine' }}
          tag=${{ inputs.tag || '0.26.0-preview.2' }}
          release_url="https://github.com/$repo/releases/download/$tag"
          package_name="voicevox_engine-macos-${{ matrix.architecture }}-$tag"
          mkdir -p download
          curl -fsSL --retry 3 --retry-delay 5 -o "download/list.txt" "$release_url/$package_name.7z.txt"
          <download/list.txt xargs -I '%' curl -fsSL --retry 3 --retry-delay 5 -o "download/%" "$release_url/%"
          7z x "download/$(head -n1 download/list.txt)"

      - name: Show otool dump data
        run: |
          find ./macos-${{ matrix.architecture }} -type f -exec sh -c '
            for f do
              if file "$f" | grep -q "Mach-O"; then
                echo "=== $f ==="
                otool -l "$f" 2>/dev/null |
                  grep -A 3 -E "LC_BUILD_VERSION|LC_VERSION_MIN_"
              fi
            done
            ' sh {} +
