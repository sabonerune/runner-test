name: Test onnxrutime otool

on:
  - push

jobs:
  test-onnxruntime:
    runs-on: macos-15-intel

    steps:
      - name: Download voicevox-onnxruntime
        run: |
          curl -fsSL https://github.com/VOICEVOX/onnxruntime-builder/releases/download/voicevox_onnxruntime-1.23.2/voicevox_onnxruntime-osx-x86_64-1.23.2.tgz | \
          tar -xzf -

      - name: Download onnxruntime
        run: |
          curl -fsSL https://github.com/sabonerune/onnxruntime-builder/releases/download/onnxruntime-1.23.2-preview.0/onnxruntime-osx-x86_64-1.23.2.tgz | \
          tar -xzf -

      - name: Show voicevox-onnxruntime dump data
        run: |
          otool -l ./voicevox_onnxruntime-osx-x86_64-1.23.2/lib/libvoicevox_onnxruntime.1.23.2.dylib

      - name: Show onnxruntime dump data
        run: |
          otool -l ./onnxruntime-osx-x86_64-1.23.2/lib/libonnxruntime.1.23.2.dylib
